# Lint the Python scripts that we actively maintain. The Jupyter notebook
# Globe+Markets.ipynb is preserved verbatim as the original 2017 walkthrough
# and is intentionally not subject to lint rules.

extend-exclude = ["Globe+Markets.ipynb", "data/"]

line-length = 100

[lint]
# E/F = pycodestyle + pyflakes (real correctness signals).
# UP/B = pyupgrade + bugbear (modernity + likely-bug patterns).
# `I` (import sorting) intentionally omitted — too opinionated for a
# small repo where contributor PRs shouldn't be blocked on import order.
select = ["E", "F", "UP", "B"]
ignore = []
